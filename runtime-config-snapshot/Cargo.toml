[package]
name = "skiff-runtime-config-snapshot"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
skiff-artifact-model = { path = "../artifact-model" }
skiff-canonical-json = { path = "../canonical-json" }
thiserror = "2.0"
uuid = { version = "1.16", features = ["v4"] }
