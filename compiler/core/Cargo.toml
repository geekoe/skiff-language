[package]
name = "skiff-compiler-core"
version = "0.1.0"
edition = "2021"
publish = false

[lints]
workspace = true

[dependencies]
skiff-artifact-model = { path = "../../artifact-model" }
skiff-canonical-json = { path = "../../canonical-json" }
skiff-syntax = { path = "../../syntax" }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
hex = "0.4"
sha2 = "0.10"
thiserror = "2.0"
