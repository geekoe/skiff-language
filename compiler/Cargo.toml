[package]
name = "skiff-compiler"
version = "0.1.0"
edition = "2021"
publish = false
autotests = false

[lib]
path = "driver/lib.rs"

[[bin]]
name = "skiff-compiler"
path = "driver/bin/skiff-compiler.rs"

[lints]
workspace = true

[features]
default = []

[[test]]
name = "config_shape"
path = "tests/config_shape.rs"

