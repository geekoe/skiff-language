[workspace]
resolver = "2"
members = [
  "canonical-json",
  "artifact-model",
  "artifact-identity",
  "deployment",
  "profiling",
  "task-control",
  "runtime-config-snapshot",
  "config-snapshot-tooling",
  "syntax",
  "router",
  "compiler/core",
  "compiler/contract",
  "compiler/input-model",
  "compiler/input",
  "compiler/source",
  "compiler/lowering",
  "compiler/compiled",
  "compiler/projection-input",
  "compiler/projection",
  "compiler/emission",
  "compiler",
  "runtime",
  "runtime/activation",
  "runtime/boundary",
  "runtime/bytecode-verifier",
  "runtime/capability-context",
  "runtime/deployment-image",
  "runtime/host",
  "runtime/linked-bytecode",
  "runtime/linked-type-plan",
  "runtime/linker",
  "runtime/loader",
  "runtime/model",
  "runtime/native",
  "runtime/native-contract",
  "runtime/package-test",
  "runtime/request-contract",
  "runtime/service-db",
  "runtime/request",
  "runtime/scheduler",
  "runtime/transport",
  "runtime/vm",
  "test-runner",
]

[workspace.lints.clippy]
tests_outside_test_module = "deny"
too_many_lines = "deny"
# 嵌套阻塞防护：tokio 拒绝在 runtime 线程上再次 block_on（"Cannot block the
# current thread from within a runtime" panic）。只禁 Handle::block_on（async
# 上下文内嵌套阻塞的典型写法）；Runtime::block_on 保留给进程入口与
# #[tokio::test] 宏展开。禁止路径清单在 .clippy.toml 的 disallowed-methods。
disallowed_methods = "deny"
