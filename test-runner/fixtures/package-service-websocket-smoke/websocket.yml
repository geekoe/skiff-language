path: /socket
connect:
  handler: main.websocketConnect
  adapterArgs:
    - param: request
      source: { kind: websocket.connectRequest }
    - param: connectionId
      source: { kind: websocket.connectionId }
close:
  handler: main.handleConnectionClosed
  adapterArgs:
    - param: connectionId
      source: { kind: websocket.connectionId }
