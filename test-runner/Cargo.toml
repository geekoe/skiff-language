[package]
name = "skiff-test-runner"
version = "0.1.0"
edition = "2021"
publish = false
autotests = false

[features]
default = []

[lints.clippy]
too_many_lines = "warn"

[[bin]]
name = "skiff-test-runner"
path = "src/main.rs"

[[bin]]
name = "skiff-package-service-smoke-fixture"
path = "src/bin/package_service_smoke_fixture.rs"

[[test]]
name = "package_service_contract_deployment"
path = "tests/package_service_contract_deployment.rs"

[[test]]
name = "canonical_std_seed_bootstrap"
path = "tests/canonical_std_seed_bootstrap.rs"

[dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
thiserror = "2.0"
skiff-compiler = { path = "../compiler" }
skiff-compiler-input = { path = "../compiler/input" }
skiff-compiler-source = { path = "../compiler/source" }
skiff-deployment = { path = "../deployment" }
skiff-artifact-model = { path = "../artifact-model" }
skiff-artifact-identity = { path = "../artifact-identity" }
skiff-syntax = { path = "../syntax" }
