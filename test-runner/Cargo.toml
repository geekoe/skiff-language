[package]
name = "skiff-test-runner"
version = "0.1.0"
edition = "2021"
publish = false
autotests = false

[features]
default = []

[lints]
workspace = true

[[bin]]
name = "skiff-test-runner"
path = "src/main.rs"

[[bin]]
name = "skiff-package-service-smoke-fixture"
path = "src/bin/package_service_smoke_fixture.rs"

[[test]]
name = "test_service_flow"
path = "tests/test_service_flow.rs"

[[test]]
name = "canonical_std_seed_bootstrap"
path = "tests/canonical_std_seed_bootstrap.rs"

[[test]]
name = "http_entry_test_service"
path = "tests/http_entry_test_service.rs"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
sha2 = "0.10"
thiserror = "2.0"
skiff-compiler = { path = "../compiler" }
skiff-compiler-core = { path = "../compiler/core" }
skiff-compiler-input = { path = "../compiler/input" }
skiff-compiler-source = { path = "../compiler/source" }
skiff-deployment = { path = "../deployment" }
skiff-config-snapshot-tooling = { path = "../config-snapshot-tooling" }
skiff-runtime-config-snapshot = { path = "../runtime-config-snapshot" }
skiff-artifact-model = { path = "../artifact-model" }
skiff-artifact-identity = { path = "../artifact-identity" }
skiff-syntax = { path = "../syntax" }
skiff-runtime-model = { path = "../runtime/model" }
