id: example.com/encrypted-live-mapped
version: 0.1.0
packages:
  - id: example.com/encrypted-live-store
    version: 1.0.0
    alias: encryptedStore
    collectionNameMapping:
      package_secret: mapped_package_secret
http:
  guard: root.internal.live.guard
  routes:
    - method: POST
      path: /encrypted-live/mapped/insert
      handler: root.internal.live.insertOne
    - method: POST
      path: /encrypted-live/mapped/read
      handler: root.internal.live.readOne
    - method: POST
      path: /encrypted-live/mapped/scan
      handler: root.internal.live.scan
    - method: POST
      path: /encrypted-live/mapped/rewrite
      handler: root.internal.live.rewrite
    - method: POST
      path: /encrypted-live/mapped/service-probe-insert
      handler: root.internal.live.insertServiceContextProbe
    - method: POST
      path: /encrypted-live/mapped/service-probe-read
      handler: root.internal.live.readServiceContextProbe
    - method: POST
      path: /encrypted-live/mapped/service-probe-scan
      handler: root.internal.live.scanServiceContextProbe
    - method: POST
      path: /encrypted-live/mapped/service-probe-rewrite
      handler: root.internal.live.rewriteServiceContextProbe
    - method: POST
      path: /encrypted-live/mapped/service-probe-restore
      handler: root.internal.live.restoreServiceContextProbe
    - method: POST
      path: /encrypted-live/mapped/barrier
      handler: root.internal.live.activateBarrier
    - method: POST
      path: /encrypted-live/mapped/barrier-status
      handler: root.internal.live.barrierStatus
timeout:
  default: 120000
