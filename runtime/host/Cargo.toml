[package]
name = "skiff-runtime-host"
version = "0.1.0"
edition = "2021"
publish = false

[lints]
workspace = true

[features]
default = []
test-support = [
  "skiff-runtime-capability-context/test-support",
  "skiff-runtime-linker/test-support",
]

[dependencies]
anyhow = "1.0"
base64 = "0.22"
bytes = "1.10"
futures-util = "0.3"
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sha2 = "0.10"
skiff-artifact-identity = { path = "../../artifact-identity" }
skiff-artifact-model = { path = "../../artifact-model" }
skiff-canonical-json = { path = "../../canonical-json" }
skiff-runtime-config-snapshot = { path = "../../runtime-config-snapshot" }
skiff-runtime-activation = { path = "../activation" }
skiff-runtime-boundary = { path = "../boundary" }
skiff-runtime-capability-context = { path = "../capability-context" }
skiff-runtime-deployment-image = { path = "../deployment-image" }
skiff-runtime-linked-bytecode = { path = "../linked-bytecode" }
skiff-runtime-linker = { path = "../linker" }
skiff-runtime-loader = { path = "../loader" }
skiff-runtime-model = { path = "../model" }
skiff-runtime-native = { path = "../native" }
skiff-runtime-native-contract = { path = "../native-contract" }
skiff-runtime-package-test = { path = "../package-test" }
skiff-runtime-request = { path = "../request" }
skiff-runtime-scheduler = { path = "../scheduler" }
skiff-runtime-service-db = { path = "../service-db" }
skiff-runtime-transport = { path = "../transport" }
skiff-runtime-vm = { path = "../vm" }
skiff-deployment = { path = "../../deployment" }
thiserror = "2.0"
time = { version = "0.3.47", features = ["formatting", "parsing"] }
tokio = { version = "1.44", features = ["fs", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = "0.26"
tracing = "0.1"
url = "2.5"
uuid = { version = "1.16", features = ["v4"] }

[dev-dependencies]
mongodb = "3.2"
skiff-compiler = { path = "../../compiler" }
skiff-compiler-core = { path = "../../compiler/core" }
skiff-compiler-input = { path = "../../compiler/input" }
skiff-compiler-source = { path = "../../compiler/source" }
skiff-deployment = { path = "../../deployment" }
skiff-runtime-boundary = { path = "../boundary", features = ["test-support"] }
skiff-runtime-capability-context = { path = "../capability-context", features = ["test-support"] }
skiff-runtime-linker = { path = "../linker", features = ["test-support"] }
skiff-runtime-linked-bytecode = { path = "../linked-bytecode" }
skiff-test-runner = { path = "../../test-runner" }
