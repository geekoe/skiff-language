[package]
name = "skiff-runtime-service-db"
version = "0.1.0"
edition = "2021"
publish = false

[lints]
workspace = true

[features]
default = []
test-support = []
migration-tool = ["dep:hmac", "dep:serde_yaml"]

[[bin]]
name = "skiff-service-db-migrate"
path = "src/bin/skiff-service-db-migrate.rs"
required-features = ["migration-tool"]

[dependencies]
aes-gcm = "0.10"
base64 = "0.22"
futures-util = "0.3"
hex = "0.4"
hkdf = "0.12"
hmac = { version = "0.12", optional = true }
libc = "0.2"
mongodb = "3.2"
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = { version = "0.9", optional = true }
sha2 = "0.10"
skiff-artifact-model = { path = "../../artifact-model" }
skiff-runtime-boundary = { path = "../boundary" }
skiff-runtime-capability-context = { path = "../capability-context" }
skiff-runtime-model = { path = "../model" }
thiserror = "2.0"
time = { version = "0.3.47", features = ["formatting", "parsing"] }
tokio = { version = "1.44", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
uuid = { version = "1.16", features = ["v4"] }
zeroize = "1.8"

[dev-dependencies]
hmac = "0.12"
serde_yaml = "0.9"
