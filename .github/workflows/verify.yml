name: Verify

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ matrix.scope }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - scope: Skiff Source Tests
            command: node scripts/verify.mjs --only skiff-tests
          - scope: Implementation Tests
            command: node scripts/verify.mjs --only implementation-tests
          - scope: Router Rust Contracts and Process Smoke
            command: node scripts/verify.mjs --only router,router-rust-process-smoke
          - scope: Quality and Checks
            command: node scripts/verify.mjs --only rust-quality,type-check,checks
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Set up pnpm
        run: npm install --global pnpm@10.29.2

      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy --no-self-update
          rustup default stable

      - name: Install package dependencies
        run: |
          pnpm --dir telemetry install --frozen-lockfile
          pnpm --dir scripts install --frozen-lockfile
          pnpm --dir vscode install --frozen-lockfile

      - name: Run ${{ matrix.scope }} scope
        run: ${{ matrix.command }}
