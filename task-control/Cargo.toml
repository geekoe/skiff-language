[package]
name = "skiff-task-control"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
skiff-artifact-model = { path = "../artifact-model" }
skiff-deployment = { path = "../deployment" }

async-trait = "0.1"
futures-util = "0.3"
mongodb = "3.2"
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
serde_json = "1.0"

[lints]
workspace = true
