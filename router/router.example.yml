profile: dev
environment: dev
host: 127.0.0.1
artifactsPath: ../var/skiff-artifacts
serviceDb:
  mongoUrl: mongodb://127.0.0.1:27017/?replicaSet=rs0
ecosystemStoreCliPath: /opt/skiff/bin/skiff-compiler
# The router reads environments/<environment>/activation.json and only routes
# the committed RuntimeAssembly. globalIngress (protocol, Host, method, path)
# is the sole public selector.
requestTimeoutMs: 20000

http:
  port: 4000
  # Optional. Defaults to 67108864 when omitted.
  # bodyLimitBytes: 67108864

runtime:
  port: 4001
  path: /runtime
