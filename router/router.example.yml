# Router process config — frozen contract (see
# doc/implementation/router-rust-migration/contracts/router-rust-migration-c-config-leaf.md). Unknown keys are
# rejected; relative paths resolve against this file; secret leaves
# (serviceDb.mongoUrl, direct OSS credentials) are redacted in diagnostics.
profile: dev
host: 127.0.0.1
artifactsPath: ../var/skiff-artifacts
serviceDb:
  mongoUrl: mongodb://127.0.0.1:27017/?replicaSet=rs0
# The router reads immutable RuntimeAssembly and ServiceContract records from
# artifactsPath. Activation state and audit are stored transactionally in the
# configured MongoDB. globalIngress is the sole public selector.
requestTimeoutMs: 20000
activation:
  prepareTimeoutMs: 120000

http:
  port: 4000
  maxRequestBytes: 67108864
  maxResponseBytes: 67108864

runtime:
  port: 4001
  path: /runtime
  maxConcurrency: 256

# Optional run dir: when set, the router acquires an exclusive
# <runDir>/router.pid file before binding listeners (process self-defense
# against double start under the same run dir). The pid file is removed on
# graceful shutdown; a stale file with a dead pid is taken over on next start.
# runDir: ../.skiff-dev/router
