profile: dev
artifactsPath: ./artifacts
serviceDb:
  mongoUrl: mongodb://user:pass@127.0.0.1:27017/skiff
http:
  maxRequestBytes: 1
  maxResponseBytes: 1
runtime:
  maxConcurrency: 1
fileBackend:
  oss:
    endpoint: https://oss-cn-hangzhou.aliyuncs.com
    bucket: skiff-files
    accessKeyId: local-only-id
    accessKeySecret: local-only-secret
