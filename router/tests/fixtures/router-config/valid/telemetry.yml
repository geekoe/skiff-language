profile: dev
artifactsPath: ./artifacts
serviceDb:
  mongoUrl: mongodb://127.0.0.1:27017/skiff
http:
  maxRequestBytes: 1
  maxResponseBytes: 1
runtime:
  maxConcurrency: 1
telemetry:
  enabled: true
  endpoint: ws://127.0.0.1:4002/telemetry
  protocol: skiff-telemetry-v1
  queueMaxEvents: 5
  batchMaxEvents: 3
  batchMaxBytes: 1024
  flushIntervalMs: 500
